name: SHARE-ED Automation Test Suite

on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'เลือกชุดทดสอบที่ต้องการรัน'
        required: true
        default: 'lifecycle'
        type: choice
        options:
          - lifecycle
          - create
          - draft
          - edit
          - delete
          - detail
          - all
          - sync-sheet

permissions:
  contents: read

concurrency:
  group: post-tests
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        run: |
          if [ "${{ github.event.inputs.test_suite }}" = "lifecycle" ]; then
            npx playwright test tests/post/lifecycle-flow.spec.js --project=chromium
          elif [ "${{ github.event.inputs.test_suite }}" = "create" ]; then
            npx playwright test tests/post/create-post.spec.js --project=chromium
          elif [ "${{ github.event.inputs.test_suite }}" = "draft" ]; then
            npx playwright test tests/post/draft-post.spec.js --project=chromium
          elif [ "${{ github.event.inputs.test_suite }}" = "edit" ]; then
            npx playwright test tests/post/edit-post.spec.js --project=chromium
          elif [ "${{ github.event.inputs.test_suite }}" = "delete" ]; then
            npx playwright test tests/post/delete-post.spec.js --project=chromium
          elif [ "${{ github.event.inputs.test_suite }}" = "detail" ]; then
            npx playwright test tests/post/detail-post.spec.js --project=chromium
          elif [ "${{ github.event.inputs.test_suite }}" = "sync-sheet" ]; then
            npm run test:sync-sheet
          else
            npx playwright test tests/post/ --project=chromium --workers=1
          fi
        env:
          MEMBER_EMAIL: ${{ secrets.MEMBER_EMAIL || secrets.MEMBER_EMAIL }}
          MEMBER_PASSWORD: ${{ secrets.MEMBER_PASSWORD || secrets.MEMBER_PASSWORD }}
          BASE_URL: https://share-ed.online/

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload videos screenshots and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 30
